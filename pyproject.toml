[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempestas"
version = "0.1.0"
description = "Verificação retrospectiva de eventos extremos de chuva: previsto × observado"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "scipy",
  "netCDF4",
  "pyyaml",
  "shapely>=2",
  "matplotlib",
  "requests",
]

[project.optional-dependencies]
relatorio = ["python-docx"]
download = ["cdsapi"]
dev = ["pytest"]

[project.scripts]
tempestas = "tempestas.cli:main"

[tool.setuptools.packages.find]
include = ["tempestas*"]

[tool.setuptools.package-data]
tempestas = ["data/*.geojson"]
